name: GramGenie checks
on:
  push:
  pull_request:
jobs:
  gramgenie:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install HMMER and Prodigal
        run: sudo apt-get update && sudo apt-get install -y hmmer prodigal
      - name: Run unit and real-tool integration tests
        run: python -m unittest discover -s tests -v
